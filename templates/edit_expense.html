{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/edit_expense.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container" style="max-width:700px;margin:2rem auto;">
    <section class="dashboard-card section-card">
        <h2 class="section-title">Edit Expense</h2>

        <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}" class="form-grid">
            <div class="form-row">
                <label for="amount">Amount</label>
                <input id="amount" name="amount" type="text" class="form-input" value="{{ expense.amount }}" required>
            </div>

            <div class="form-row">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-input" required>
                    {% for cat_name in ["Food", "Travel", "Bills", "Shopping", "Health", "Entertainment", "Other"] %}
                    <option value="{{ cat_name }}" {% if expense.category == cat_name %}selected{% endif %}>{{ cat_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label for="date">Date</label>
                <input id="date" name="date" type="date" class="form-input" value="{{ expense.date }}" required>
            </div>

            <div class="form-row">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-input" rows="4">{{ expense.description }}</textarea>
            </div>

            <div class="form-actions" style="display:flex;gap:1rem;align-items:center;margin-top:1rem;">
                <button type="submit" class="btn-primary">Save changes</button>
                <a href="{{ url_for('dashboard') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
